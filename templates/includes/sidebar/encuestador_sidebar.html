<!-- === sidebar_encuestador.html (menú de Encuestador) === -->
<li class="nav-item">
  <a class="nav-link" href="{% url 'encuestador:encuestador_dashboard' %}">
    <i class="fas fa-clipboard-list me-2 text-success"></i>
    <span class="justify-content-center">Encuestador</span>
  </a>
</li>

<hr class="sidebar-divider">

<div class="sidebar-heading text-uppercase small px-3">
  Módulos
</div>

<!-- sidebar.html -->
<div class="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-brand-icon">
      <i class="fas fa-clipboard-check"></i>
    </div>
    <div class="sidebar-brand-text">Encuestador</div>
  </div>

  <ul class="nav flex-column">
    <li class="nav-item">
      <a class="nav-link active text-center" title="Panel de Encuestador" data-bs-toggle="tooltip" href="{% url 'encuestador:encuestador_dashboard' %}">
        <i class="fas fa-tachometer-alt"></i>
        <span>Dashboard</span>
      </a>
    </li>
    
    <li class="nav-item">
      <a class="nav-link collapsed" href="#" data-bs-toggle="collapse" data-bs-target="#collapseEncuestasMenu" aria-expanded="false" aria-controls="collapseEncuestasMenu" title="Gestión de Encuestas">
        <i class="fas fa-edit"></i>
        <span>Encuestas</span>
      </a>
      <div id="collapseEncuestasMenu" class="collapse">
        <div class="collapse-inner">
          <a class="collapse-item" href="{% url 'encuestador:mis_encuestas' %}">
            <i class="fas fa-tasks me-2"></i>Mis Encuestas
          </a>

        </div>
      </div>
    </li>

  </ul>

  <button id="sidebarToggle">
    <i class="fas fa-angle-double-right"></i>
  </button>
</div>

<!-- content wrapper -->
<div id="content-wrapper">
  {% block content %}
  {% endblock %}
</div>
