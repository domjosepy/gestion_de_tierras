<!-- Modal Crear Objetivo Rápido -->
<div class="modal fade" id="modalCrearObjetivoRapido" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Crear Objetivo (Rápido)</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="formCrearObjetivoRapido">
        {% csrf_token %}
        <input type="hidden" id="rapido_grupo_id" name="grupo">
        <div class="modal-body">
          <div class="mb-2">
            <strong>Usuarios asignados:</strong> <span id="rapido_usuarios_count">0</span>
          </div>
          <div class="mb-2">
            <strong>Líder:</strong> <span id="rapido_lider">-</span>
          </div>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Tipo de Objetivo <span class="text-danger">*</span></label>
              <select id="rapido_tipo_objetivo" name="tipo_objetivo" class="form-select" required>
                <option value="">Seleccione un tipo</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Fecha de Conclusión <span class="text-danger">*</span></label>
              <input type="date" name="fecha_fin" id="rapido_fecha_fin" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Cantidad / Meta <span class="text-danger">*</span></label>
              <input type="number" name="meta" id="rapido_meta" class="form-control" min="1" required>
            </div>
            <div class="col-12">
              <label class="form-label">Descripción (opcional)</label>
              <textarea name="descripcion" id="rapido_descripcion" class="form-control" rows="3"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Crear Objetivo</button>
        </div>
      </form>
    </div>
  </div>
</div>
