<!-- ============================================== -->
<!-- MODAL PARA CONFIRMAR ELIMINACIÓN               -->
<!-- ============================================== -->
<div class="modal fade" id="modalEliminarPretendiente" tabindex="-1" aria-labelledby="modalEliminarLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-danger">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="modalEliminarLabel"><i class="fas fa-exclamation-triangle me-2"></i>Atención</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center py-4">
        <i class="fas fa-user-slash text-danger mb-3" style="font-size: 3rem;"></i>
        <h5>¿Eliminar a <strong id="span-nombre-pretendiente" class="text-danger"></strong>?</h5>
        <p class="text-muted small mb-0 mt-2">Se borrarán también todas sus viviendas, miembros de la familia, cultivos y ganadería asociados. Esta acción no se puede deshacer.</p>
      </div>
      <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-outline-danger" id="btn-confirmar-eliminar">
          <i class="fas fa-trash me-1"></i> Sí, eliminar
        </button>
      </div>
    </div>
  </div>
</div>

{% block scripts %}
<!-- Este es el JS que carga el modal de forma segura al final de la página -->

<script>
  document.addEventListener("DOMContentLoaded", function() {
      const modalEliminar = document.getElementById('modalEliminarPretendiente');
      const spanNombre = document.getElementById('span-nombre-pretendiente');
      const btnConfirmar = document.getElementById('btn-confirmar-eliminar');
      let formAEliminar = null;

      if (modalEliminar) {
          modalEliminar.addEventListener('show.bs.modal', function (event) {
              const boton = event.relatedTarget;
              const nombrePretendiente = boton.getAttribute('data-nombre');
              const formId = boton.getAttribute('data-form-id');

              spanNombre.textContent = nombrePretendiente;
              formAEliminar = document.getElementById(formId);
          });

          btnConfirmar.addEventListener('click', function () {
              if (formAEliminar) {
                  formAEliminar.submit();
              }
          });
      }
  });
</script>
{% endblock %}
