<!-- ============================================================ -->
<!-- MODAL: Agregar/editar dimensión del lote -->
<!-- ============================================================ -->
<div class="modal fade modal-secondary" id="modalDimension" tabindex="-1" aria-labelledby="modalDimensionLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-white" id="modalDimensionLabel"><i class="fas fa-ruler-combined me-2"></i>Dimensión del lote</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="validacion-modal-error d-none" id="dimension-modal-error" role="alert">
            <i class="fas fa-exclamation-circle"></i>
            <span id="dimension-modal-error-text">Cargue frente y fondo (números mayores a 0).</span>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">{{ form.frente_aprox.label }} <span class="text-danger">*</span></label>
              {{ form.frente_aprox }}
              <small class="text-muted d-block mt-1">En metros</small>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">{{ form.fondo_aprox.label }} <span class="text-danger">*</span></label>
              {{ form.fondo_aprox }}
              <small class="text-muted d-block mt-1">En metros</small>
            </div>
          </div>
        </div>
        <div class="modal-footer justify-content-between">
          <button type="button" class="btn btn-outline-danger" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-outline-primary" id="guardar-dimension-btn">Guardar</button>
        </div>
      </div>
    </div>
  </div>
</div>
