<div class="modal fade modal-secondary" id="modalInstitucion" tabindex="-1" aria-labelledby="modalInstitucionLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalInstitucionLabel"><i class="fas fa-landmark me-2"></i>Institución / Servicio</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="validacion-modal-error d-none" id="institucion-modal-error" role="alert">
          <i class="fas fa-exclamation-circle"></i>
          <span id="institucion-modal-error-text">El nombre es obligatorio.</span>
        </div>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold">Nombre del servicio <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="modal_institucion_nombre" placeholder="Ingrese nombre del servicio">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">RUC</label>
            <input type="text" class="form-control" id="modal_institucion_ruc" placeholder="Ej: 12345678-9">
          </div>
        </div>
        <div class="mt-3">
          <label class="form-label fw-semibold">Descripción</label>
          <textarea class="form-control" id="modal_institucion_descripcion" rows="3" placeholder="Ingrese descripción del servicio"></textarea>
        </div>
      </div>
      <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-outline-danger" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="guardar-institucion-btn">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const modalInstitucion = document.getElementById('modalInstitucion');
    const inputNombre = document.getElementById('modal_institucion_nombre');
    const inputRuc = document.getElementById('modal_institucion_ruc');
    const errorDiv = document.getElementById('institucion-modal-error');
    const errorText = document.getElementById('institucion-modal-error-text');

    // Validar nombre en tiempo real
    if (inputNombre) {
        inputNombre.addEventListener('blur', function() {
            if (this.value.trim() === '') {
                errorText.textContent = 'El nombre del servicio es obligatorio.';
                errorDiv.classList.remove('d-none');
            } else {
                errorDiv.classList.add('d-none');
            }
        });
    }

    // Validar al guardar
    document.getElementById('guardar-institucion-btn')?.addEventListener('click', function() {
        const nombre = inputNombre?.value.trim() || '';

        if (!nombre) {
            errorText.textContent = 'El nombre del servicio es obligatorio.';
            errorDiv.classList.remove('d-none');
            inputNombre?.focus();
            return;
        }

        errorDiv.classList.add('d-none');

        // Llamar a la función guardarInstitucion del script común
        if (typeof guardarInstitucion === 'function') {
            guardarInstitucion();
        }
    });

    // Limpiar errores al abrir el modal
    modalInstitucion?.addEventListener('show.bs.modal', function() {
        errorDiv?.classList.add('d-none');
    });
});
</script>
