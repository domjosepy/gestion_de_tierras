<!-- Modal para ver archivos de una solicitud (Digitalizador) -->
<div class="modal fade" id="archivosDigitalizadorModal" tabindex="-1" aria-labelledby="archivosDigitalizadorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title" id="archivosDigitalizadorModalLabel">
                    <i class="fas fa-file-archive me-2"></i>Archivos de la Solicitud
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="archivosDigitalizadorModalBody">
                <!-- Contenido cargado vía AJAX -->
                <div class="text-center py-4">
                    <div class="spinner-border text-info" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <p class="mt-2">Cargando archivos...</p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
