<!-- Modal Crear Objetivo Rápido (archivo separado) -->
<div class="modal fade modal-primary" id="modalCrearObjetivo" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">
          <i class="fas fa-bullseye me-2"></i>Crear Objetivo
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="formCrearObjetivo">
        {% csrf_token %}
        <input type="hidden" id="grupo_id" name="grupo_id">
        <div class="modal-body">
          <!-- Información del Grupo -->
          <div class="alert alert-info mb-3">
            <div class="row">
              <div class="col-md-12 mb-2">
                <strong>Grupo:</strong> <span id="grupo_nombre">-</span>
              </div>
              <div class="col-md-6">
                <strong>Usuarios asignados:</strong> <span id="usuarios_count">0</span>
              </div>
              <div class="col-md-6">
                <strong>Líder:</strong> <span id="lider">-</span>
              </div>
            </div>
          </div>

          <!-- Campos del Objetivo -->
          <div class="row g-3">
            <div class="col-md-6">
              <label for="tipo_objetivo" class="form-label">Tipo de Objetivo <span class="text-danger">*</span></label>
              <select id="tipo_objetivo" name="tipo_objetivo" class="form-select" required>
                <option value="">Cargando tipos...</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-6">
              <label for="fecha_fin" class="form-label">Fecha Final de la Meta <span class="text-danger">*</span></label>
              <input type="date" name="fecha_fin" id="fecha_fin" class="form-control" required>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-6">
              <label for="meta" class="form-label">Meta <span class="text-danger">*</span></label>
              <input type="number" name="meta" id="meta" class="form-control" min="1" placeholder="Cantidad a alcanzar" required>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-6">
              <label for="avance_actual" class="form-label">Avance Actual</label>
              <input type="number" name="avance_actual" id="avance_actual" class="form-control" min="0" value="0" placeholder="0">
              <small class="text-muted">Opcional: dejar en 0 si es un objetivo nuevo</small>
            </div>
            <div class="col-12">
              <label for="observacion" class="form-label">Observación</label>
              <textarea name="observacion" id="observacion" class="form-control" rows="3" placeholder="Descripción o detalles adicionales (opcional)"></textarea>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input type="checkbox" name="activo" id="activo" class="form-check-input" checked>
                <label class="form-check-label" for="activo">
                  Objetivo Activo
                </label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer justify-content-between">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
            <i class="fas fa-times me-2"></i>Cancelar
          </button>
          <button type="submit" class="btn btn-outline-primary">
            <i class="fas fa-save me-2"></i>Crear Objetivo
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
