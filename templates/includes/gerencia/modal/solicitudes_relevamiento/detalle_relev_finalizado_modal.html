{% load static tz %}
<!-- Modal de Detalles de Relevamiento Finalizado -->
<div class="modal fade modal-success" id="detalleRelevFinalizadoModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title fw-bold">
          <i class="fas fa-clipboard-check me-2"></i>
          Detalles de Relevamiento Finalizado
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detalleRelevFinalizadoContent">
        <!-- Contenido cargado por JS -->
        <div class="text-center">
          <div class="spinner-border text-success" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
          <p class="mt-2">Cargando información del relevamiento...</p>
        </div>
      </div>
      <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-1"></i>Cerrar
        </button>
        <button type="button" class="btn btn-success" id="btnExportarRelevFinalizadoPDF">
          <i class="fas fa-file-pdf me-1"></i>Exportar PDF
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// Función para ver detalles de relevamiento finalizado
function verDetalleRelevamientoFinalizado(solicitudId) {
    // Mostrar spinner
    document.getElementById('detalleRelevFinalizadoContent').innerHTML = `
        <div class="text-center">
          <div class="spinner-border text-success" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
          <p class="mt-2">Cargando información del relevamiento...</p>
        </div>
    `;
    
    // Mostrar modal inmediatamente
    const modal = new bootstrap.Modal(document.getElementById('detalleRelevFinalizadoModal'));
    modal.show();
    
    // Obtener datos
    fetch(`/gerencia/solicitudes-relevamiento/finalizado/${solicitudId}/`)
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            if (data.success) {
                // Determinar color del badge de estado
                let estadoColor = 'success';
                if (data.solicitud.estado.includes('finalizado')) estadoColor = 'dark';
                
                // Determinar color del badge de tipo
                let tipoColor = data.solicitud.tipo === 'relevamiento' ? 'info' : 'warning';
                
                // Determinar color del estado de orden
                let estadoOrdenColor = 'secondary';
                if (data.orden_trabajo.estado.includes('completada')) estadoOrdenColor = 'success';
                if (data.orden_trabajo.estado.includes('proceso')) estadoOrdenColor = 'primary';
                if (data.orden_trabajo.estado.includes('cancelada')) estadoOrdenColor = 'danger';
                
                const content = `
                    <!-- Encabezado con ID y estado -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <div class="d-flex align-items-center">
                                <div class="p-3 me-3">
                                    <i class="fas fa-clipboard-check fa-2x text-success"></i>
                                </div>
                                <div>
                                    <h4 class="mb-0">Solicitud #${data.solicitud.id}</h4>
                                    <small class="text-muted">Orden de Trabajo #${data.orden_trabajo.id || 'N/A'}</small>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 text-end">
                            <span class="badge bg-${estadoColor} fs-6 py-2 px-3 mb-2">
                                <i class="fas fa-flag me-1"></i>
                                ${data.solicitud.estado_display}
                            </span>
                        </div>
                    </div>
                    
                    <!-- Datos geográficos -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-gradient" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                            <h6 class="mb-0 text-white">
                                <i class="fas fa-map-marked-alt me-2"></i>Datos Geográficos
                            </h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="d-flex align-items-center mb-3">
                                        <div class="p-3 rounded-circle bg-primary bg-opacity-10 me-3">
                                            <i class="fas fa-map-marker-alt text-primary fa-lg"></i>
                                        </div>
                                        <div>
                                            <small class="text-muted d-block">Departamento</small>
                                            <strong>${data.departamento.nombre}</strong>
                                            ${data.departamento.codigo ? `<br><small class="text-muted">Código: ${data.departamento.codigo}</small>` : ''}
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="d-flex align-items-center mb-3">
                                        <div class="p-3 rounded-circle bg-success bg-opacity-10 me-3">
                                            <i class="fas fa-map text-success fa-lg"></i>
                                        </div>
                                        <div>
                                            <small class="text-muted d-block">Distrito</small>
                                            <strong>${data.distrito.nombre}</strong>
                                            ${data.distrito.codigo ? `<br><small class="text-muted">Código: ${data.distrito.codigo}</small>` : ''}
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="d-flex align-items-center mb-3">
                                        <div class="p-3 rounded-circle bg-warning bg-opacity-10 me-3">
                                            <i class="fas fa-tractor text-warning fa-lg"></i>
                                        </div>
                                        <div>
                                            <small class="text-muted d-block">Colonia</small>
                                            <strong>${data.colonia.nombre}</strong>
                                            <br>
                                            <small class="text-muted">Código: ${data.colonia.codigo}</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Tipo de estudio y Estado de orden -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <div class="card border-0 shadow-sm h-100">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0 text-white"><i class="fas fa-clipboard-list me-2"></i>Tipo de Estudio</h6>
                                </div>
                                <div class="card-body text-center py-4">
                                    <span class="badge bg-${tipoColor} fs-5 py-2 px-4">
                                        <i class="fas fa-${data.solicitud.tipo === 'relevamiento' ? 'map-marked-alt' : 'sync-alt'} me-2"></i>
                                        ${data.solicitud.tipo_display}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card border-0 shadow-sm h-100">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0 text-white"><i class="fas fa-tasks me-2"></i>Estado de Orden de Trabajo</h6>
                                </div>
                                <div class="card-body text-center py-4">
                                    <span class="badge bg-${estadoOrdenColor} fs-5 py-2 px-4">
                                        <i class="fas fa-check-circle me-2"></i>
                                        ${data.orden_trabajo.estado_display}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Línea de tiempo de fechas -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-light">
                            <h6 class="mb-0 text-white"><i class="fas fa-calendar-alt me-2"></i>Línea de Tiempo</h6>
                        </div>
                        <div class="card-body">
                            <div class="row g-3">
                                <div class="col-md-6 col-lg-3">
                                    <div class="p-3 border-start border-info border-4 bg-light">
                                        <small class="text-muted d-block mb-1">
                                            <i class="fas fa-calendar-plus me-1"></i>Fecha de Creación
                                        </small>
                                        <strong class="text-info">${data.solicitud.fecha_creacion || 'N/A'}</strong>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 col-lg-3">
                                    <div class="p-3 border-start border-primary border-4 bg-light">
                                        <small class="text-muted d-block mb-1">
                                            <i class="fas fa-user-check me-1"></i>Fecha de Asignación
                                        </small>
                                        <strong class="text-primary">${data.solicitud.fecha_asignacion || 'N/A'}</strong>
                                    </div>
                                </div>
                                <div class="col-md-6 col-lg-3">
                                    <div class="p-3 border-start border-success border-4 bg-light">
                                        <small class="text-muted d-block mb-1">
                                            <i class="fas fa-check me-1"></i>Fecha de Aprobación
                                        </small>
                                        <strong class="text-success">${data.solicitud.fecha_aprobacion || 'N/A'}</strong>
                                    </div>
                                </div>
                                <div class="col-md-6 col-lg-3">
                                    <div class="p-3 border-start border-warning border-4 bg-light">
                                        <small class="text-muted d-block mb-1">
                                            <i class="fas fa-clipboard-check me-1"></i>Fecha Orden de Trabajo
                                        </small>
                                        <strong class="text-warning">${data.orden_trabajo.fecha_creacion || 'N/A'}</strong>
                                    </div>
                                </div>
                            </div>
                            <div class="row g-3 mt-2">
                                <div class="col-md-6">
                                    <div class="p-3 border-start border-secondary border-4 bg-light">
                                        <small class="text-muted d-block mb-1">
                                            <i class="fas fa-play-circle me-1"></i>Fecha Inicio de Orden
                                        </small>
                                        <strong class="text-secondary">${data.orden_trabajo.fecha_inicio_real || data.orden_trabajo.fecha_inicio_planeada || 'N/A'}</strong>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="p-3 border-start border-dark border-4 bg-light">
                                        <small class="text-muted d-block mb-1">
                                            <i class="fas fa-flag-checkered me-1"></i>Fecha Fin de Orden
                                        </small>
                                        <strong class="text-dark">${data.orden_trabajo.fecha_fin_real || data.orden_trabajo.fecha_fin_planeada || 'N/A'}</strong>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Estadísticas del Relevamiento -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-gradient" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                            <h6 class="mb-0 text-white">
                                <i class="fas fa-chart-pie me-2"></i>Estadísticas del Relevamiento
                            </h6>
                        </div>
                        <div class="card-body">
                            <div class="row text-center">
                                <div class="col-md-3 mb-3">
                                    <div class="p-3 border rounded">
                                        <i class="fas fa-map-pin fa-2x text-primary mb-2"></i>
                                        <h3 class="mb-0 text-primary">${data.estadisticas.lotes_digitalizados}</h3>
                                        <small class="text-muted">Lotes Digitalizados</small>
                                    </div>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <div class="p-3 border rounded">
                                        <i class="fas fa-bullseye fa-2x text-info mb-2"></i>
                                        <h3 class="mb-0 text-info">${data.estadisticas.meta_encuestas}</h3>
                                        <small class="text-muted">Meta de Encuestas</small>
                                    </div>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <div class="p-3 border rounded">
                                        <i class="fas fa-clipboard-list fa-2x text-success mb-2"></i>
                                        <h3 class="mb-0 text-success">${data.estadisticas.total_encuestas}</h3>
                                        <small class="text-muted">Encuestas Realizadas</small>
                                    </div>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <div class="p-3 border rounded">
                                        <i class="fas fa-check-double fa-2x text-success mb-2"></i>
                                        <h3 class="mb-0 text-success">${data.estadisticas.encuestas_exitosas}</h3>
                                        <small class="text-muted">Encuestas Exitosas</small>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Barra de progreso de éxito -->
                            <div class="mt-4">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="fw-bold"><i class="fas fa-percentage me-2"></i>Tasa de Éxito del Relevamiento</span>
                                    <span class="badge bg-${data.estadisticas.porcentaje_exito >= 80 ? 'success' : data.estadisticas.porcentaje_exito >= 60 ? 'warning' : 'danger'} fs-5 px-3 py-2">
                                        ${data.estadisticas.porcentaje_exito}%
                                    </span>
                                </div>
                                <div class="progress" style="height: 30px;">
                                    <div class="progress-bar ${data.estadisticas.porcentaje_exito >= 80 ? 'bg-success' : data.estadisticas.porcentaje_exito >= 60 ? 'bg-warning' : 'bg-danger'} progress-bar-striped progress-bar-animated" 
                                         role="progressbar" 
                                         style="width: ${data.estadisticas.porcentaje_exito}%;" 
                                         aria-valuenow="${data.estadisticas.porcentaje_exito}" 
                                         aria-valuemin="0" 
                                         aria-valuemax="100">
                                        <strong>${data.estadisticas.encuestas_exitosas} de ${data.estadisticas.total_encuestas}</strong>
                                    </div>
                                </div>
                                <small class="text-muted mt-1 d-block text-center">
                                    ${data.estadisticas.total_mermas} registros problemáticos (ausentes, rechazos, conflictos)
                                </small>
                            </div>
                            
                            <!-- Desglose de problemas -->
                            ${data.estadisticas.total_mermas > 0 ? `
                                <div class="mt-4">
                                    <h6 class="text-muted mb-3"><i class="fas fa-exclamation-triangle me-2"></i>Desglose de Problemas</h6>
                                    <div class="row">
                                        <div class="col-md-4">
                                            <div class="p-2 bg-light rounded text-center">
                                                <i class="fas fa-user-slash text-secondary"></i>
                                                <strong class="d-block">${data.estadisticas.ausentes || 0}</strong>
                                                <small class="text-muted">Ausentes</small>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="p-2 bg-light rounded text-center">
                                                <i class="fas fa-times-circle text-danger"></i>
                                                <strong class="d-block">${data.estadisticas.rechazos || 0}</strong>
                                                <small class="text-muted">Rechazos</small>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="p-2 bg-light rounded text-center">
                                                <i class="fas fa-exclamation-circle text-warning"></i>
                                                <strong class="d-block">${data.estadisticas.conflictos || 0}</strong>
                                                <small class="text-muted">En Conflicto</small>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                    
                    <!-- Equipo asignado -->
                    ${data.grupo_info || data.usuario_info || data.coordinador_campo_info || data.subcoordinadores_info.length > 0 || data.encuestadores_info.length > 0 ? `
                        <div class="card border-0 shadow-sm">
                            <div class="card-header bg-light">
                                <h6 class="mb-0 text-white"><i class="fas fa-users me-2"></i>Equipo Asignado</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    ${data.grupo_info ? `
                                        <div class="col-md-6 mb-3">
                                            <div class="d-flex align-items-center">
                                                <div class="p-2 me-2">
                                                    <i class="fas fa-users fa-2x" style="color: ${data.grupo_info.color || '#6c757d'}"></i>
                                                </div>
                                                <div>
                                                    <small class="text-muted d-block">Grupo</small>
                                                    <strong>${data.grupo_info.nombre}</strong>
                                                    ${data.grupo_info.lider ? `<br><small class="text-muted">Líder: ${data.grupo_info.lider}</small>` : ''}
                                                </div>
                                            </div>
                                        </div>
                                    ` : ''}
                                    ${data.usuario_info ? `
                                        <div class="col-md-6 mb-3">
                                            <div class="d-flex align-items-center">
                                                <div class="p-2 me-2">
                                                    <i class="fas fa-user fa-2x text-primary"></i>
                                                </div>
                                                <div>
                                                    <small class="text-muted d-block">Coordinador Asignado</small>
                                                    <strong>${data.usuario_info.nombre_completo || data.usuario_info.username}</strong>
                                                    ${data.usuario_info.email ? `<br><small class="text-muted">${data.usuario_info.email}</small>` : ''}
                                                </div>
                                            </div>
                                        </div>
                                    ` : ''}
                                    ${data.coordinador_campo_info ? `
                                        <div class="col-md-6 mb-3">
                                            <div class="d-flex align-items-center">
                                                <div class="p-2 me-2">
                                                    <i class="fas fa-user-tie fa-2x text-success"></i>
                                                </div>
                                                <div>
                                                    <small class="text-muted d-block">Coordinador de Campo</small>
                                                    <strong>${data.coordinador_campo_info.nombre_completo || data.coordinador_campo_info.username}</strong>
                                                    ${data.coordinador_campo_info.email ? `<br><small class="text-muted">${data.coordinador_campo_info.email}</small>` : ''}
                                                </div>
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                                
                                <!-- Subcoordinadores -->
                                ${data.subcoordinadores_info && data.subcoordinadores_info.length > 0 ? `
                                    <div class="mt-3 border-top pt-3">
                                        <h6 class="text-muted mb-3">
                                            <i class="fas fa-user-friends me-2"></i>Subcoordinadores (${data.subcoordinadores_info.length})
                                        </h6>
                                        <div class="row">
                                            ${data.subcoordinadores_info.map(subcoor => `
                                                <div class="col-md-6 mb-2">
                                                    <div class="d-flex align-items-center bg-light p-2 rounded">
                                                        <i class="fas fa-user-check text-info me-2"></i>
                                                        <div>
                                                            <strong class="small">${subcoor.nombre_completo || subcoor.username}</strong>
                                                            ${subcoor.email ? `<br><small class="text-muted">${subcoor.email}</small>` : ''}
                                                        </div>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                                
                                <!-- Encuestadores -->
                                ${data.encuestadores_info && data.encuestadores_info.length > 0 ? `
                                    <div class="mt-3 border-top pt-3">
                                        <h6 class="text-muted mb-3">
                                            <i class="fas fa-clipboard-user me-2"></i>Encuestadores (${data.encuestadores_info.length})
                                        </h6>
                                        <div class="row">
                                            ${data.encuestadores_info.map(enc => `
                                                <div class="col-md-4 mb-2">
                                                    <div class="d-flex align-items-center bg-light p-2 rounded">
                                                        <i class="fas fa-user text-secondary me-2"></i>
                                                        <div>
                                                            <strong class="small">${enc.nombre_completo || enc.username}</strong>
                                                        </div>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    ` : ''}
                `;
                
                document.getElementById('detalleRelevFinalizadoContent').innerHTML = content;
                
                // Configurar botón de exportar PDF
                const btnExportar = document.getElementById('btnExportarRelevFinalizadoPDF');
                btnExportar.onclick = function() {
                    window.print(); // Por ahora usamos print, se puede implementar PDF específico después
                };
            } else {
                document.getElementById('detalleRelevFinalizadoContent').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Error al cargar los detalles del relevamiento finalizado.
                    </div>
                `;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('detalleRelevFinalizadoContent').innerHTML = `
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    Error de conexión. Por favor intente nuevamente.
                </div>
            `;
        });
}
</script>
