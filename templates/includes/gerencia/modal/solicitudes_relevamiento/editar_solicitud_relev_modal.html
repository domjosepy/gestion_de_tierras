<div class="modal fade modal-warning" id="editarSolicitudRelevModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <form id="editarSolicitudRelevForm" method="post" action="" novalidate>
        {% csrf_token %}
        <div class="modal-header bg-warning text-white">
          <h5 class="modal-title"><i class="fa-solid fa-edit me-2"></i>Editar Solicitud</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <!-- Datos geográficos (solo lectura) -->
              <h6 class="mb-0"><i class="fas fa-map-marked-alt me-2"></i>Datos Geográficos</h6>
            <div class="card-body p-3">
              <div class="row g-2">
                <div class="col-md-4">
                  <div class="border rounded p-2 bg-light">
                    <div class="text-muted small">Departamento</div>
                    <div class="fw-bold">
                      <i class="fas fa-map-marker-alt text-primary me-1"></i>
                      <span id="editarDepartamentoTexto"></span>
                    </div>
                  </div>
                </div>
                
                <div class="col-md-4">
                  <div class="border rounded p-2 bg-light">
                    <div class="text-muted small">Distrito</div>
                    <div class="fw-bold">
                      <i class="fas fa-map text-success me-1"></i>
                      <span id="editarDistritoTexto"></span>
                    </div>
                  </div>
                </div>
                
                <div class="col-md-4">
                  <div class="border rounded p-2 bg-light">
                    <div class="text-muted small">Colonia</div>
                    <div class="fw-bold">
                      <i class="fas fa-tractor text-warning me-1"></i>
                      <span id="editarColoniaTexto"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
    
          <!-- Información de la solicitud -->
          <div class="card mb-4">
            <div class="card-header bg-light py-2">
              <h6 class="mb-0 text-white"><i class="fas fa-clipboard-check me-2"></i>Detalles de la Solicitud</h6>
            </div>
            <div class="card-body">
              <!-- Estado actual (solo lectura) -->
              <div class="row mb-3">
                <div class="col-md-4">
                  <label class="form-label fw-bold"><i class="fas fa-clipboard-list me-1"></i>Estado:</label>
                </div>
                <div class="col-md-8">
                  <div class="form-control bg-light" id="editarEstado"></div>
                </div>
              </div>
              
              <!-- Tipo (solo lectura) -->
              <div class="row mb-3">
                <div class="col-md-4">
                  <label class="form-label fw-bold"><i class="fas fa-tasks me-1"></i>Tipo:</label>
                </div>
                <div class="col-md-8">
                  <div class="form-control bg-light" id="editarTipo"></div>
                </div>
              </div>
              
              <!-- Observaciones (editable) -->
              <div class="mb-3">
                <label class="form-label fw-bold"><i class="fas fa-comment-dots me-1"></i>Observaciones</label>
                <textarea name="observaciones" id="editarObservaciones" class="form-control" rows="3"
                          placeholder="Ingrese observaciones adicionales"></textarea>
                <div class="invalid-feedback"></div>
              </div>
            </div>
          </div>

          <div id="editarSolicitudRelevError" class="text-danger small mb-3"></div>
        </div>

        <div class="modal-footer justify-content-between">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
            <i class="fas fa-times me-1"></i>Cancelar</button>
          <button type="submit" class="btn btn-outline-warning">
            <i class="fas fa-save me-1"></i>Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
      const modal = document.getElementById('editarSolicitudRelevModal');    
      const form = document.getElementById("editarSolicitudRelevForm");
      const errorDiv = document.getElementById("editarSolicitudRelevError");

      modal.addEventListener('show.bs.modal', async (event) => {
          const button = event.relatedTarget;
          const solicitudId = button.getAttribute('data-solicitudid');
          
          try {
              // Cargar datos COMPLETOS de la solicitud
              const response = await fetch(`/gerencia/solicitudes-relevamiento/${solicitudId}/datos/`);
              const data = await response.json();
              
              if (data.success) {
                  // Mostrar información geográfica
                  document.getElementById('editarDepartamentoTexto').textContent = 
                      `${data.departamento.codigo} - ${data.departamento.nombre}`;
                  document.getElementById('editarDistritoTexto').textContent = 
                      `${data.distrito.codigo} - ${data.distrito.nombre}`;
                  document.getElementById('editarColoniaTexto').textContent = 
                      `${data.colonia.codigo} - ${data.colonia.nombre}`;
                  
                  // Mostrar información de la solicitud
                  document.getElementById('editarEstado').textContent = data.estado_display;
                  document.getElementById('editarTipo').textContent = data.tipo_display;
                  document.getElementById('editarObservaciones').value = data.observaciones || '';
                  
                  // Establecer URL del formulario
                  form.action = `/gerencia/solicitudes-relevamiento/${solicitudId}/editar/`;
              } else {
                  errorDiv.textContent = 'Error al cargar los datos de la solicitud';
              }
          } catch (error) {
              console.error('Error:', error);
              errorDiv.textContent = 'Error al cargar los datos de la solicitud';
          }
      });

      form.addEventListener("submit", async (e) => {
          e.preventDefault();
          
          const btnSubmit = form.querySelector('button[type="submit"]');
          const oldText = btnSubmit.innerHTML;

          btnSubmit.disabled = true;
          btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Guardando...';

          try {
              const res = await fetch(form.action, {
                  method: "POST",
                  headers: { 
                      "X-Requested-With": "XMLHttpRequest",
                      "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
                  },
                  body: new FormData(form)
              });

              const data = await res.json();
              console.log("Respuesta edición:", data); // Para debugging

              if (data.success) {
                  // Cerrar modal primero
                  const modalInstance = bootstrap.Modal.getInstance(modal);
                  modalInstance.hide();
                  
                  // Redirigir a la lista (el toast se mostrará desde la sesión)
                  setTimeout(() => {
                      window.location.href = data.redirect_url || window.location.href;
                  }, 300);
              } else {
                  // Mostrar errores específicos
                  if (data.errors) {
                      for (const [field, messages] of Object.entries(data.errors)) {
                          const input = form.querySelector('[name="' + field + '"]');
                          const feedback = input ? input.nextElementSibling : null;
                          if (input && feedback) {
                              input.classList.add('is-invalid');
                              feedback.textContent = Array.isArray(messages) ? messages.join(' ') : messages;
                          }
                      }
                  }
                  
                  if (data.message) {
                      errorDiv.textContent = data.message;
                  }
              }
          } catch (error) {
              console.error('Error:', error);
              errorDiv.textContent = 'Error al actualizar. Intente nuevamente.';
          } finally {
              btnSubmit.disabled = false;
              btnSubmit.innerHTML = oldText;
          }
      });
  });
</script>
