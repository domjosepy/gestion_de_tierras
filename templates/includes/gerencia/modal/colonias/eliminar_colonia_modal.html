<!-- Modal Eliminar Colonia -->
<div class="modal fade modal-danger" id="eliminarColoniaModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">
          <i class="fas fa-exclamation-triangle me-2"></i>Eliminar Colonia
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form id="formEliminarColonia" method="POST">
        {% csrf_token %}
        <input type="hidden" id="eliminar_colonia_id">
        
        <div class="modal-body">
          <div class="card border-danger">
            <div class="card-body">
              <h6 class="card-subtitle mb-2 text-muted">Colonia a eliminar:</h6>
              <p class="card-text mb-1">
                <strong>Código:</strong> <span id="eliminar_codigo"></span>
              </p>
              <p class="card-text mb-1">
                <strong>Nombre:</strong> <span id="eliminar_nombre" class="text-danger"></span>
              </p>
              <p class="card-text mb-1">
                <strong>Distritos:</strong> <span id="eliminar_distritos"></span>
              </p>
              <p class="card-text mb-0">
                <strong>Departamento(s):</strong> <span id="eliminar_departamentos"></span>
              </p>
            </div>
          </div>

          <div class="alert alert-warning d-none mt-3" id="alert_solicitudes_info">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span id="mensaje_solicitudes_info"></span>
          </div>
        </div>

        <div class="modal-footer justify-content-between">
          <button type="button" class="btn btn-outline-warning" data-bs-dismiss="modal">
            <i class="fas fa-times me-1"></i>Cancelar
          </button>
          <button type="submit" class="btn btn-outline-danger" id="btnEliminarColonia">
            <i class="fas fa-trash me-1"></i>Eliminar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const modal = document.getElementById('eliminarColoniaModal');
    const form = document.getElementById('formEliminarColonia');
    const btnEliminar = document.getElementById('btnEliminarColonia');

    // Cargar datos al abrir modal
    modal.addEventListener('show.bs.modal', function(event) {
      const button = event.relatedTarget;
      const coloniaId = button.getAttribute('data-coloniaid');
      const coloniaNombre = button.getAttribute('data-colonianombre');
      const coloniaCodigo = button.getAttribute('data-coloniacodigo');
      const coloniaDistritos = button.getAttribute('data-coloniadistritos');
      
      // Obtener información de solicitudes y relevamientos si están disponibles
      const tieneSolicitudes = button.getAttribute('data-tienesolicitudes') === 'true';
     
      const cantSolicitudes = button.getAttribute('data-cantsolicitudes') || '0';


      // Establecer datos en el formulario
      document.getElementById('eliminar_colonia_id').value = coloniaId;
      document.getElementById('eliminar_nombre').textContent = coloniaNombre;
      document.getElementById('eliminar_codigo').textContent = coloniaCodigo || 'N/A';
      
      // Mostrar distritos
      const distritosSpan = document.getElementById('eliminar_distritos');
      if (coloniaDistritos && coloniaDistritos.trim() !== '') {
        distritosSpan.textContent = coloniaDistritos;
      } else {
        distritosSpan.textContent = 'No especificados';
      }
      
      // Obtener departamentos de los distritos (esto puede requerir un atributo adicional)
      const departamentos = button.getAttribute('data-departamentos');
      const departamentosSpan = document.getElementById('eliminar_departamentos');
      if (departamentos && departamentos.trim() !== '') {
        departamentosSpan.textContent = departamentos;
      } else {
        departamentosSpan.textContent = 'No especificados';
      }

      // Manejar alertas de solicitudes, hacer lo mismo para relevamiento
      const alertSolicitudes = document.getElementById('alert_solicitudes_info');
      const mensajeSolicitudes = document.getElementById('mensaje_solicitudes_info');
      
      if (tieneSolicitudes) {
        mensajeSolicitudes.textContent = 
          `Esta colonia tiene ${cantSolicitudes} solicitud(es) asociada(s). No podrá eliminarse hasta que se procesen o eliminen.`;
        alertSolicitudes.classList.remove('d-none');
        btnEliminar.disabled = true;
      } else {
        alertSolicitudes.classList.add('d-none');
      }


      // Habilitar botón solo si no hay asociaciones; mas adelante cuando se cree el 
      // modelo relevamiento reemplazar al parentesis (!tieneSolicitudes && !tieneRelevamientos)
      if (!tieneSolicitudes) {
        btnEliminar.disabled = false;
      }

      // Establecer la URL del formulario
      form.action = `{% url 'gerencia:eliminar_colonia' 0 %}`.replace('0', coloniaId);
    });

    // Limpiar al cerrar modal
    modal.addEventListener('hidden.bs.modal', function() {
      form.reset();
      document.getElementById('alert_solicitudes_info').classList.add('d-none');
      document.getElementById('alert_relevamientos_info').classList.add('d-none');
      btnEliminar.disabled = false;
    });

    // Enviar formulario
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const coloniaId = document.getElementById('eliminar_colonia_id').value;
      const formData = new FormData(form);
      const btnTextoOriginal = btnEliminar.innerHTML;

      btnEliminar.disabled = true;
      btnEliminar.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Eliminando...';

      fetch(form.action, {
        method: 'POST',
        body: formData,
        headers: {
          'X-Requested-With': 'XMLHttpRequest',
          'X-CSRFToken': formData.get('csrfmiddlewaretoken')
        }
      })
      .then(response => {
        if (!response.ok) {
          return response.json().then(errorData => {
            throw errorData;
          });
        }
        return response.json();
      })
      .then(data => {
        if (data.success) {
          bootstrap.Modal.getInstance(modal).hide();
          location.reload();
        } else {
          // Mostrar mensaje de error
          mostrarToast('error', data.message || 'No se pudo eliminar la colonia');
        }
      })
      .catch(error => {
        console.error('Error:', error);
        mostrarToast('error', 'Ocurrió un error al eliminar la colonia');
      })
      .finally(() => {
        btnEliminar.disabled = false;
        btnEliminar.innerHTML = btnTextoOriginal;
      });
    });
  });
</script>
