<!-- Modal: Crear Colonia desde Distrito -->
<div class="modal fade" id="crearColoniaDesdeDistritoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">
          <i class="fas fa-tractor me-2"></i>Crear Colonia para: 
          <span class="fst-italic" id="distrito_nombre_header"></span>
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      
      <form id="formCrearColoniaDistrito" method="POST" action="{% url 'gerencia:crear_colonia' %}">
        {% csrf_token %}
        <input type="hidden" id="distrito_asignado" name="distritos">

        <div class="modal-body">
          <!-- Código -->
          <div class="mb-3">
            <label for="colonia_codigo" class="form-label fw-bold">
              <i class="fas fa-hashtag me-1"></i>Código
            </label>
            <input type="number" 
                   class="form-control" 
                   id="colonia_codigo" 
                   name="codigo" 
                   min="1">
            <div class="invalid-feedback"></div>
            <small class="text-muted">Debe ser único en el sistema</small>
          </div>

          <!-- Nombre -->
          <div class="mb-3">
            <label for="colonia_nombre" class="form-label fw-bold">
              <i class="fas fa-signature me-1"></i>Nombre de la Colonia
            </label>
            <input type="text" 
                   class="form-control" 
                   id="colonia_nombre" 
                   name="nombre" 
                   maxlength="250"
                   minlength="3">
            <div class="invalid-feedback"></div>
            <small class="text-muted">Mínimo 3 caracteres. Debe ser único dentro del distrito seleccionado</small>
          </div>

          <!-- Div para errores generales -->
          <div id="crearColoniaError" class="text-danger small mb-3"></div>
        </div>

        <div class="modal-footer justify-content-between">
          <button type="button" class="btn btn-outline-warning" data-bs-dismiss="modal">
            <i class="fas fa-times me-1"></i>Cancelar
          </button>
          <button type="submit" class="btn btn-outline-success">
            <i class="fas fa-save me-1"></i>Crear Colonia
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const modal = document.getElementById('crearColoniaDesdeDistritoModal');
  const form = document.getElementById('formCrearColoniaDistrito');
  const errorDiv = document.getElementById('crearColoniaError');

  function limpiarErrores(form) {
      form.querySelectorAll('.is-invalid').forEach(input => {
          input.classList.remove('is-invalid');
      });
      form.querySelectorAll('.invalid-feedback').forEach(div => {
          div.textContent = '';
      });
      errorDiv.textContent = '';
  }

  // Cargar datos al abrir modal
  modal.addEventListener('show.bs.modal', function(e) {
      const btn = e.relatedTarget;
      const distritoNombre = btn.dataset.nombre;
      
      document.getElementById('distrito_asignado').value = btn.dataset.id;
      document.getElementById('distrito_nombre_header').textContent = `"${distritoNombre}"`;
      document.getElementById('colonia_codigo').value = '';
      document.getElementById('colonia_nombre').value = '';
      
      limpiarErrores(form);
  });

  // Limpiar al cerrar modal
  modal.addEventListener('hidden.bs.modal', function() {
      form.reset();
      limpiarErrores(form);
      form.classList.remove('was-validated');
  });

  // Enviar formulario
  form.addEventListener('submit', function(e) {
      e.preventDefault();
      limpiarErrores(form);

      const formData = new FormData(form);
      const btnSubmit = form.querySelector('button[type="submit"]');
      const oldText = btnSubmit.innerHTML;

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Creando...';

      fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: {
              'X-Requested-With': 'XMLHttpRequest',
              'X-CSRFToken': formData.get('csrfmiddlewaretoken')
          }
      })
      .then(r => r.json())
      .then(data => {
          if (data.success) {
              bootstrap.Modal.getInstance(modal).hide();
              location.reload();
          } else {
              if (data.errors) {
                  // Mostrar errores por campo
                  for (const [field, messages] of Object.entries(data.errors)) {
                      const input = form.querySelector('[name="' + field + '"]');
                      const feedback = input ? input.nextElementSibling : null;
                      if (input && feedback) {
                          input.classList.add('is-invalid');
                          feedback.textContent = messages.join(' ');
                      }
                  }
              } else if (data.message) {
                  errorDiv.textContent = data.message;
              }
          }
      })
      .catch(error => {
          console.error('Error:', error);
          errorDiv.textContent = 'Error al guardar. Intente nuevamente.';
      })
      .finally(() => {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = oldText;
      });
  });
});
</script>
