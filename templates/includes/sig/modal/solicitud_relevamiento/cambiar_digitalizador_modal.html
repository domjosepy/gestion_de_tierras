<div class="modal fade modal-warning" id="cambiarDigitalizadorModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="cambiarDigitalizadorForm" method="post">
        {% csrf_token %}
        <div class="modal-header bg-warning text-white">
          <h5 class="modal-title">
            <i class="fas fa-user-pen me-2"></i>Cambiar Digitalizador
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        
        <div class="modal-body">
          <input type="hidden" name="solicitud_id" id="solicitudIdCambiar">
          
          <div class="mb-3">
            <label class="form-label fw-bold">
              <i class="fas fa-map-marker-alt me-1"></i>Colonia
            </label>
            <div class="form-control bg-light" id="coloniaNombreCambiar"></div>
          </div>
          
          <div class="mb-3">
            <label class="form-label fw-bold">
              <i class="fas fa-user me-1"></i>Digitalizador Actual
            </label>
            <div class="form-control bg-light" id="digitalizadorActualCambiar"></div>
            <input type="hidden" id="observacionActualCambiar">
          </div>
          
          <div class="mb-3">
            <label for="usuarioAsignadoCambiar" class="form-label fw-bold">
              <i class="fas fa-user-plus me-1"></i>Nuevo Digitalizador
            </label>
            <select class="form-select" id="usuarioAsignadoCambiar" name="usuario_id" required>
              <option value="">Seleccione un digitalizador</option>
              {% for usuario in usuarios_grupo %}
                <option value="{{ usuario.id }}">
                  {{ usuario.username }} 
                  {% if usuario.get_full_name %}
                    - {{ usuario.get_full_name }}
                  {% endif %}
                </option>
              {% endfor %}
            </select>
          </div>
          
          <div class="mb-3">
            <label for="comentarioCambio" class="form-label">
              <i class="fas fa-comment me-1"></i>Comentario del cambio (opcional)
            </label>
            <textarea class="form-control" id="comentarioCambio" 
                      name="comentario" rows="2"
                      placeholder="Motivo del cambio..."></textarea>
          </div>
          
          <div id="cambiarError" class="text-danger small mb-3"></div>
        </div>
        
        <div class="modal-footer justify-content-between">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
            <i class="fas fa-times me-1"></i>Cancelar
          </button>
          <button type="submit" class="btn btn-outline-warning">
            <i class="fas fa-exchange-alt me-1"></i>Cambiar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const cambiarForm = document.getElementById('cambiarDigitalizadorForm');
    if (cambiarForm) {
        cambiarForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const solicitudId = formData.get('solicitud_id');
            const btnSubmit = this.querySelector('button[type="submit"]');
            const originalText = btnSubmit.innerHTML;
            
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Cambiando...';
            
            try {
                const response = await fetch(`/sig/solicitud/${solicitudId}/cambiar-usuario/`, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Mostrar mensaje de éxito usando ToastManager
                    if (window.ToastManager) {
                        window.ToastManager.mostrarToast(data.message, 'success');
                    } else if (window.mostrarToast) {
                        window.mostrarToast(data.message, 'success');
                    }
                    
                    // Cerrar modal
                    const modalElement = document.getElementById('cambiarDigitalizadorModal');
                    if (modalElement) {
                        const modal = bootstrap.Modal.getInstance(modalElement);
                        if (modal) modal.hide();
                    }
                    
                    // Recargar después de 1.5 segundos
                    setTimeout(() => {
                        location.reload();
                    }, 1500);
                } else {
                    const cambiarError = document.getElementById('cambiarError');
                    if (cambiarError) cambiarError.textContent = data.error;
                    
                    // Mostrar error con ToastManager
                    if (window.ToastManager) {
                        window.ToastManager.mostrarToast(data.error, 'error');
                    } else if (window.mostrarToast) {
                        window.mostrarToast(data.error, 'error');
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                const cambiarError = document.getElementById('cambiarError');
                if (cambiarError) cambiarError.textContent = 'Error de conexión. Intente nuevamente.';
                
                // Mostrar error de conexión
                if (window.ToastManager) {
                    window.ToastManager.mostrarToast('Error de conexión. Intente nuevamente.', 'error');
                } else if (window.mostrarToast) {
                    window.mostrarToast('Error de conexión. Intente nuevamente.', 'error');
                }
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = originalText;
            }
        });
    }
});
</script>
