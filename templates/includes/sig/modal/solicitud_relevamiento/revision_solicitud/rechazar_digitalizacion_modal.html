<!-- includes/sig/modal/solicitud_relevamiento/revision_solicitud/rechazar_digitalizacion_modal.html -->
<div class="modal fade" id="rechazarDigitalizacionModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">
                    <i class="fas fa-times-circle me-2"></i>Rechazar Digitalización
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="formRechazarDigitalizacion">
                {% csrf_token %}
                <input type="hidden" id="solicitudIdRechazar" name="solicitud_id">
                
                <div class="modal-body">
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <span id="textoRechazarInfo">¿Rechazar esta digitalización?</span>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            <i class="fas fa-map-marker-alt me-1"></i>Colonia
                        </label>
                        <div class="form-control bg-light" id="coloniaNombreRechazar"></div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="motivoRechazo" class="form-label fw-bold">
                            <i class="fas fa-ban me-1"></i>Motivo del Rechazo <span class="text-danger">*</span>
                        </label>
                        <textarea class="form-control" id="motivoRechazo" name="motivo_rechazo" 
                                  rows="4" placeholder="Especifique el motivo del rechazo..." required></textarea>
                        <div class="form-text">Este motivo será visible para el digitalizador.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="observacionRechazar" class="form-label">
                            <i class="fas fa-comment me-1"></i>Observaciones Adicionales (Opcional)
                        </label>
                        <textarea class="form-control" id="observacionRechazar" name="observacion" 
                                  rows="2" placeholder="Observaciones adicionales..."></textarea>
                    </div>
                    
                    <div id="rechazarError" class="alert alert-danger d-none"></div>
                </div>
                
                <div class="modal-footer justify-content-between">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-1"></i>Cancelar
                    </button>
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-ban me-1"></i>Rechazar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Listener para cuando se abre el modal
    const rechazarModal = document.getElementById('rechazarDigitalizacionModal');
    if (rechazarModal) {
        rechazarModal.addEventListener('show.bs.modal', function(event) {
            const button = event.relatedTarget;
            const solicitudId = button.getAttribute('data-solicitud-id');
            const coloniaNombre = button.getAttribute('data-colonia-nombre');
            const estadoActual = button.getAttribute('data-estado-actual');
            
            // Actualizar el modal
            document.getElementById('solicitudIdRechazar').value = solicitudId;
            document.getElementById('coloniaNombreRechazar').textContent = coloniaNombre;
            
            // Cambiar texto según estado
            const textoInfo = document.getElementById('textoRechazarInfo');
            if (estadoActual === 'en_proceso_digitalizacion') {
                textoInfo.textContent = `¿Rechazar la digitalización de "${coloniaNombre}"?`;
            } else if (estadoActual === 'pendiente_revision_sig') {
                textoInfo.textContent = `¿Rechazar la revisión SIG de "${coloniaNombre}"?`;
            }
            
            // Limpiar formulario
            document.getElementById('motivoRechazo').value = '';
            document.getElementById('observacionRechazar').value = '';
            const errorDiv = document.getElementById('rechazarError');
            if (errorDiv) {
                errorDiv.textContent = '';
                errorDiv.classList.add('d-none');
            }
        });
    }

    // Listener para el submit
    const rechazarForm = document.getElementById('formRechazarDigitalizacion');
    if (rechazarForm) {
        rechazarForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const solicitudId = formData.get('solicitud_id');
            const motivoRechazo = formData.get('motivo_rechazo') || '';
            const observacion = formData.get('observacion') || '';
            const btnSubmit = this.querySelector('button[type="submit"]');
            const originalText = btnSubmit.innerHTML;
            
            // Validación
            if (!motivoRechazo.trim()) {
                const errorDiv = document.getElementById('rechazarError');
                if (errorDiv) {
                    errorDiv.textContent = 'El motivo del rechazo es obligatorio';
                    errorDiv.classList.remove('d-none');
                }
                return;
            }
            
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Procesando...';
            
            try {
                const response = await fetch(`/sig/solicitud/${solicitudId}/rechazar-digitalizacion/`, {
                    method: 'POST',
                    body: JSON.stringify({
                        motivo_rechazo: motivoRechazo,
                        observacion: observacion
                    }),
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const modal = bootstrap.Modal.getInstance(rechazarModal);
                    if (modal) modal.hide();
                    
                    if (window.ToastManager) {
                        window.ToastManager.mostrarToast(data.message, 'success');
                    }
                    
                    setTimeout(() => location.reload(), 1000);
                } else {
                    const errorDiv = document.getElementById('rechazarError');
                    if (errorDiv) {
                        errorDiv.textContent = data.message;
                        errorDiv.classList.remove('d-none');
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                const errorDiv = document.getElementById('rechazarError');
                if (errorDiv) {
                    errorDiv.textContent = 'Error de conexión. Intente nuevamente.';
                    errorDiv.classList.remove('d-none');
                }
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = originalText;
            }
        });
    }
});
</script>
