<div class="modal fade modal-danger" id="eliminarAsignacionModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="eliminarAsignacionForm" method="post">
        {% csrf_token %}
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title">
            <i class="fas fa-user-minus me-2"></i>Eliminar Asignación
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        
        <div class="modal-body">
          <input type="hidden" name="solicitud_id" id="solicitudIdEliminar">
          
          <div class="alert alert-warning">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <strong>¡Atención!</strong> Esta acción eliminará la asignación actual y devolverá la solicitud a "Pendiente de asignación".
          </div>
          
          <div class="mb-3">
            <label class="form-label fw-bold">
              <i class="fas fa-map-marker-alt me-1"></i>Colonia
            </label>
            <div class="form-control bg-light" id="coloniaNombreEliminar"></div>
          </div>
          
          <div class="mb-3">
            <label class="form-label fw-bold">
              <i class="fas fa-user me-1"></i>Digitalizador Actual
            </label>
            <div class="form-control bg-light" id="digitalizadorActualEliminar"></div>
          </div>
          
          <div class="mb-3">
            <label for="comentarioEliminacion" class="form-label">
              <i class="fas fa-comment me-1"></i>Motivo (opcional)
            </label>
            <textarea class="form-control" id="comentarioEliminacion" 
                      name="comentario" rows="2"
                      placeholder="Motivo de la eliminación..."></textarea>
          </div>
          
          <div id="eliminarError" class="text-danger small mb-3"></div>
        </div>
        
        <div class="modal-footer justify-content-between">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
            <i class="fas fa-times me-1"></i>Cancelar
          </button>
          <button type="submit" class="btn btn-outline-danger">
            <i class="fas fa-trash me-1"></i>Eliminar Asignación
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const eliminarForm = document.getElementById('eliminarAsignacionForm');
    if (eliminarForm) {
        eliminarForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const solicitudId = formData.get('solicitud_id');
            const btnSubmit = this.querySelector('button[type="submit"]');
            const originalText = btnSubmit.innerHTML;
            
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Eliminando...';
            
            try {
                const response = await fetch(`/sig/solicitud/${solicitudId}/eliminar-asignacion/`, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Mostrar mensaje de éxito
                    if (window.ToastManager) {
                        window.ToastManager.mostrarToast(data.message, 'success');
                    } else if (window.mostrarToast) {
                        window.mostrarToast(data.message, 'success');
                    }
                    
                    // Cerrar modal
                    const modalElement = document.getElementById('eliminarAsignacionModal');
                    if (modalElement) {
                        const modal = bootstrap.Modal.getInstance(modalElement);
                        if (modal) modal.hide();
                    }
                    
                    // Recargar después de 1.5 segundos
                    setTimeout(() => {
                        location.reload();
                    }, 1500);
                } else {
                    const eliminarError = document.getElementById('eliminarError');
                    if (eliminarError) eliminarError.textContent = data.error;
                    
                    // Mostrar error con ToastManager
                    if (window.ToastManager) {
                        window.ToastManager.mostrarToast(data.error, 'error');
                    } else if (window.mostrarToast) {
                        window.mostrarToast(data.error, 'error');
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                const eliminarError = document.getElementById('eliminarError');
                if (eliminarError) eliminarError.textContent = 'Error de conexión. Intente nuevamente.';
                
                // Mostrar error de conexión
                if (window.ToastManager) {
                    window.ToastManager.mostrarToast('Error de conexión. Intente nuevamente.', 'error');
                } else if (window.mostrarToast) {
                    window.mostrarToast('Error de conexión. Intente nuevamente.', 'error');
                }
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = originalText;
            }
        });
    }
});
</script>
