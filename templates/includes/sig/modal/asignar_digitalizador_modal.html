<div class="modal fade" id="modalAsignar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold">
                    <i class="fas fa-user-tag me-2"></i>Asignar Digitalizador
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="formAsignar">
                    {% csrf_token %}
                    <input type="hidden" id="solicitudId" name="solicitud_id">
                    
                    <div class="mb-4">
                        <label for="digitalizadorSelect" class="form-label fw-bold">Técnico Digitalizador:</label>
                        <select class="form-select form-select-lg" id="digitalizadorSelect" name="digitalizador_id" required>
                            <option value="">-- Seleccione un técnico --</option>
                            {% for digitalizador in digitalizadores %}
                            <option value="{{ digitalizador.id }}">
                                {{ digitalizador.get_full_name|default:digitalizador.username }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="alert alert-light border-start border-info border-4">
                        <div class="d-flex">
                            <i class="fas fa-info-circle text-info me-3 mt-1"></i>
                            <div>
                                <small class="text-muted d-block">Nota de proceso:</small>
                                <strong>La solicitud será notificada al técnico y cambiará su estado a "Asignado".</strong>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer bg-light px-4 py-3">
                <button type="button" class="btn btn-white border shadow-sm" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary px-4 shadow" id="btnConfirmarAsignacion">
                    Confirmar Asignación
                </button>
            </div>
        </div>
    </div>
</div>
