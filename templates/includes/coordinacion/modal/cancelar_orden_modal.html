<!-- Modal Cancelar Orden -->
<div class="modal fade modal-danger" id="modalCancelarOrden" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="text-white">Cancelar Orden</h5>
            </div>
            <div class="modal-body">
                <p>¿Está seguro de cancelar la orden <strong>{{ orden.numero_orden }}</strong>?</p>
                <!-- Campo para el motivo -->
                <div class="mb-3">
                    <label for="motivoCancelacion" class="form-label">Motivo de la cancelación</label>
                    <textarea class="form-control" id="motivoCancelacion" name="motivo_cancelacion" rows="3" placeholder="Indique el motivo..."></textarea>
                </div>
            </div>
            <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Volver</button>
                <button type="button" id="btnConfirmarCancelar" class="btn btn-outline-danger">Sí, cancelar orden</button>
            </div>
        </div>
    </div>
</div>
