{% extends 'base.html' %}
{% load static %}

{% block title %}Agregar Fotos — Relevamiento #{{ relevamiento.pk }}{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h4>Agregar Fotos — Relevamiento #{{ relevamiento.pk }}</h4>
    </div>
    <div class="card-body">
      <p>Suba las fotos relacionadas con este relevamiento.</p>
      <!-- Placeholder: reemplazar por formulario de subida de archivos -->
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Seleccionar archivos</label>
          <input type="file" name="fotos" class="form-control" multiple>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">Subir fotos</button>
          <a href="{% url 'relevamiento:resumen_relevamiento' relevamiento.pk %}" class="btn btn-secondary">Volver</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
